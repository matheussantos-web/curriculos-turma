<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio da Turma - Currículos</title>
  
  <!-- CDN do Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- CDN do Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- Cabeçalho / Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600/20 border border-indigo-500/30 rounded-xl text-indigo-400">
          <i data-lucide="graduation-cap" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">Portfólio da Turma</h1>
          <p class="text-xs text-slate-400">Conheça os alunos, seus cargos e currículos</p>
        </div>
      </div>

      <!-- Barra de Busca e Botão de Cadastro -->
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="relative w-full sm:w-64">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" placeholder="Buscar por nome ou cargo..."
            class="w-full pl-9 pr-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-400 focus:outline-none focus:border-indigo-500 transition">
        </div>
        
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Skeleton Loaders (Enquanto carrega) -->
    <div id="loading-skeleton" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <script>
        for(let i=0; i<8; i++) {
          document.write(`
            <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-6 flex flex-col items-center animate-pulse">
              <div class="w-24 h-24 bg-slate-700 rounded-full mb-4"></div>
              <div class="h-5 bg-slate-700 rounded w-3/4 mb-2"></div>
              <div class="h-4 bg-slate-700/60 rounded w-1/2 mb-6"></div>
              <div class="h-10 bg-slate-700 rounded-xl w-full mt-auto"></div>
            </div>
          `);
        }
      </script>
    </div>

    <!-- Mensagem de NENHUM ALUNO -->
    <div id="empty-state" class="hidden text-center py-16 px-4">
      <div class="inline-flex p-4 bg-slate-800 border border-slate-700 rounded-2xl text-slate-400 mb-4">
        <i data-lucide="users-round" class="w-10 h-10"></i>
      </div>
      <h3 class="text-lg font-semibold text-white mb-1">Nenhum aluno encontrado</h3>
      <p class="text-slate-400 text-sm max-w-md mx-auto mb-6">Ainda não há cadastros ou nenhum registro corresponde à sua busca.</p>
    </div>

    <!-- Container dos Cards -->
    <div id="cards-container" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Cards gerados via JS -->
    </div>

  </main>

  <!-- Rodapé -->
  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>Portfólio da Turma • Integre com Supabase & Vercel</p>
  </footer>

  <script>
    // 1. CONFIGURAÇÃO DO SUPABASE
    // Cole aqui a sua URL e a sua Chave ANON do Supabase:
    const SUPABASE_URL = 'https://eempgprspimlhzlofvjx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_H8eepB7xyJndr_TdsvuiVw_pJbsPC5k';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false }
    });

    let todosMembros = [];

    const loadingSkeleton = document.getElementById('loading-skeleton');
    const emptyState = document.getElementById('empty-state');
    const cardsContainer = document.getElementById('cards-container');
    const searchInput = document.getElementById('search-input');

    // 2. BUSCAR DADOS
    async function carregarMembros() {
      try {
        const { data, error } = await supabaseClient
          .from('aluno')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        todosMembros = data || [];
        renderizarCards(todosMembros);

      } catch (err) {
        console.error('Erro ao carregar dados:', err);
        loadingSkeleton.classList.add('hidden');
        emptyState.classList.remove('hidden');
      }
    }

    // 3. RENDERIZAR CARDS
    function renderizarCards(membros) {
      loadingSkeleton.classList.add('hidden');

      if (!membros || membros.length === 0) {
        cardsContainer.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      cardsContainer.classList.remove('hidden');

      cardsContainer.innerHTML = membros.map(membro => {
        // Gera foto padrão com as iniciais caso não tenha enviado imagem
        const foto = membro.foto_url && membro.foto_url.trim() !== '' 
          ? membro.foto_url 
          : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(membro.nome) + '&background=4f46e5&color=fff&size=128';

        return `
          <div class="group bg-slate-800 hover:bg-slate-800/90 border border-slate-700/70 hover:border-indigo-500/50 rounded-2xl p-6 flex flex-col items-center text-center transition-all duration-300 shadow-lg hover:shadow-indigo-500/10 hover:-translate-y-1">
            
            <!-- Foto de Perfil -->
            <div class="relative mb-4">
              <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-indigo-500 to-slate-700 group-hover:from-indigo-400 group-hover:to-cyan-400 transition-all duration-300">
                <img src="${foto}" alt="Foto de ${membro.nome}" 
                  class="w-full h-full object-cover rounded-full bg-slate-900"
                  onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(membro.nome)}&background=4f46e5&color=fff&size=128'">
              </div>
            </div>

            <!-- Nome e Cargo -->
            <h2 class="text-lg font-bold text-white group-hover:text-indigo-300 transition-colors line-clamp-1">${escapeHtml(membro.nome)}</h2>
            <p class="text-xs font-medium text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20 mt-1 mb-6 inline-block">
              ${escapeHtml(membro.cargo)}
            </p>

            <!-- Botão do Currículo -->
            <a href="${escapeHtml(membro.curriculo_url)}" target="_blank" rel="noopener noreferrer"
              class="w-full mt-auto py-2.5 px-4 bg-slate-700/80 hover:bg-indigo-600 text-white text-sm font-semibold rounded-xl flex items-center justify-center gap-2 transition duration-200 border border-slate-600/50 hover:border-transparent group/btn">
              <span>Ver Currículo</span>
              <i data-lucide="external-link" class="w-4 h-4 text-slate-400 group-hover/btn:text-white transition-colors"></i>
            </a>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Função de proteção contra scripts maliciosos (XSS)
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 4. PESQUISA EM TEMPO REAL
    searchInput.addEventListener('input', (e) => {
      const busca = e.target.value.toLowerCase().trim();
      const filtrados = todosMembros.filter(m => 
        (m.nome && m.nome.toLowerCase().includes(busca)) || 
        (m.cargo && m.cargo.toLowerCase().includes(busca))
      );
      renderizarCards(filtrados);
    });

    // Iniciar a busca ao carregar a página
    carregarMembros();
  </script>
</body>
</html>
